name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (SM-2, Fortschritt, Export/Import)
        run: node --test
      - name: Inhalte validieren
        run: python tools/validate_content.py
      - name: Version und Precache-Liste konsistent
        run: python tools/release.py --check
